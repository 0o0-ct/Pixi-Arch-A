# Pixi-Arch-A Swappiness Optimization
# Aplicado automáticamente por el kernel en el arranque
# Copiar a: /etc/sysctl.d/99-pixi-swappiness.conf

# Perfil balanced (recomendado - uso diario)
vm.swappiness=10
vm.vfs_cache_pressure=50

# Para otros perfiles, el usuario descomenta la opción que necesita:
# Perfil Quality (GPU potente): swap más agresivo para evitar OOM
# vm.swappiness=60
# vm.vfs_cache_pressure=100

# Perfil Performance (hardware limitado): swap mínimo  
# vm.swappiness=1
# vm.vfs_cache_pressure=200