# Pixi-Arch-A Kernel & System Optimizations
# Copiar a: /etc/sysctl.d/90-pixi-optimizations.conf

# Optimización de escritura en disco (I/O throughput y menor stutter)
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Aumentar límites de vigilancia de archivos (ideal para Waybar, IDEs y monitores)
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152

# Optimización de red y reducción de latencia
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1