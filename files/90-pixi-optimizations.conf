# Pixi-Arch-A Kernel Optimizations
# Aplicado automáticamente por el kernel en el arranque
# Copiar a: /etc/sysctl.d/90-pixi-optimizations.conf

# Mejora responsividad del sistema
kernel.sched_latency_ns=15000000
kernel.sched_min_granularity_ns=5000000

# Optimización sistema de archivos
vm.dirty_ratio=40
vm.dirty_background_ratio=10

# Gestión de memoria mejorada
vm.swapaccount=1
vm.page_cache_ratio=100

# Reducir tiempo de conexiones time-wait
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_fin_timeout=30

# Evitar inundación ICMP
net.ipv4.icmp_ignore_bogus_error_responses=1