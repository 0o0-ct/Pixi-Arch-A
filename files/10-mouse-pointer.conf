# Pixi-Arch-A Mouse Pointer Configuration
# Aplicado automáticamente por Xorg/Kernel en el arranque
# Copiar a: /etc/X11/xorg.conf.d/10-mouse-pointer.conf

# Tema de cursor predeterminado: Adwaita (sistema)
# Para cambiar, modifica la línea "Inherits=" abajo

# Opciones populares para Pixi-Arch-A:
# Inherits=Bibata-Modern-Ice     # Cursor moderno Ice (requiere tema instalado)
# Inherits=Flat-Remix-Blue-Dark  # Cursor Flat-Remix Blue Dark
# Inherits=Flat-Remix-Blue-Light # Cursor Flat-Remix Blue Light  
# Inherits=Papirus               # Cursor Papirus
# Inherits=Adwaita               # Cursor predeterminado (sistema)

# Para instalar un tema de cursor manualmente:
# 1. Descomprimir el archivo .zip a ~/.local/share/icons/
# 2. O copiar la carpeta theme a /usr/share/icons/
# 3. Reiniciar el sistema o X server

# Cursor actual del sistema
Inherits=Adwaita