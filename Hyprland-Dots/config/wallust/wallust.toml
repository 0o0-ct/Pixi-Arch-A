# /* ---- 💫 https://github.com/0o0-ct/Pixi-Arch-A 💫 ---- */  #
# wallust configuration - extraction settings only.
#
# IMPORTANT: this file deliberately has no [templates] section.
# ~/.config/hypr/scripts/pixi_colors.py is the single owner of every consumer
# palette (Waybar, Rofi, Hyprland, QuickShell, SwayNC, Kitty, Ghostty, GTK,
# AGS).  It runs Wallust against a private staging directory under
# ~/.cache/pixi-colors and renders the consumers itself.  Adding a target here
# would reintroduce the old dual-owner race.

# How the image is parsed, in order to get the colours:
# full - resized - wal - thumb - fastresize - kmeans
backend = "fastresize"

# What colour space to use to produce and select the most prominent colours:
# lab - labmixed - lch - lchmixed
color_space = "lch"

# Palette scheme.  dark16 keeps a stable dark ANSI palette for terminals even
# when the Material 3 mode is light.
palette = "dark16"

# Difference between similar colours, used by the colourspace:
#  1          Not perceptible by human eyes.
#  1 - 2      Perceptible through close observation.
#  2 - 10     Perceptible at a glance.
#  11 - 49    Colours are more similar than opposite
#  100        Colours are exact opposite
threshold = 11
