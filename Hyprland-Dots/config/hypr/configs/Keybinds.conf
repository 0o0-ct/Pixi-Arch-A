# /* ---- 💫 https://github.com/0o0-ct/Pixi-Arch-A 💫 ---- */  #
# Default Keybinds
# visit https://wiki.hyprland.org/Configuring/Binds/ for more info

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

#### STANDAR ####
# Common shortcuts
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bindd = $mainMod, D, lanzador de aplicaciones, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window
bindd = $mainMod, B, abrir navegador predeterminado, exec, xdg-open "https://"
bindd = $mainMod, A, vista general del escritorio, exec, $scriptsDir/OverviewToggle.sh # toggles quickshell or ags overview (tries QS first, falls back to AGS)
#bindd = $mainMod, A, ags overview, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
#bindd = $mainMod, A, Quickshell overview, global, quickshell:overviewToggle # desktop overview (if installed)
bindd = $mainMod, Return, abrir terminal, exec, $term
bindd = $mainMod, E, administrador de archivos, exec, $files

# FEATURES / EXTRAS
bindd = $mainMod, T, selector de tema global Wallust, exec, $scriptsDir/ThemeChanger.sh #Global theme switcher
bindd = $mainMod, H, ayuda y atajos, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod ALT, R, recargar barra y menus, exec, $scriptsDir/Refresh.sh
bindd = $mainMod ALT, E, menu de emojis, exec, $scriptsDir/RofiEmoji.sh
bindd = $mainMod, S, busqueda web, exec, $scriptsDir/RofiSearch.sh
bindd = $mainMod CTRL, S, selector de ventanas, exec, rofi -show window
bindd = $mainMod ALT, O, alternar desenfoque, exec, $scriptsDir/ChangeBlur.sh
bindd = $mainMod SHIFT, G, alternar modo de juego, exec, $scriptsDir/GameMode.sh
bindd = $mainMod ALT, L, alternar diseño master/dwindle, exec, $scriptsDir/ChangeLayout.sh
bindd = $mainMod ALT, V, administrador de portapapeles, exec, $scriptsDir/ClipManager.sh
bindd = $mainMod CTRL, R, selector de temas de rofi, exec, $scriptsDir/RofiThemeSelector.sh
bindd = $mainMod CTRL SHIFT, R, selector de temas de rofi modificado, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh

bindd = $mainMod SHIFT, F, pantalla completa, fullscreen
bindd = $mainMod CTRL, F, maximizar ventana, fullscreen, 1
bindd = $mainMod, SPACE, flotar ventana actual, togglefloating,
bindd = $mainMod ALT, SPACE, flotar todas las ventanas, exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod SHIFT, Return, terminal desplegable, exec, $scriptsDir/Dropterminal.sh $term

# Desktop zooming or magnifier
bindd = $mainMod ALT, mouse_down, acercar zoom, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = $mainMod ALT, mouse_up, alejar zoom, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# Waybar / Bar related
bindd = $mainMod CTRL ALT, B, alternar waybar, exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL, B, menu de estilos waybar, exec, $scriptsDir/WaybarStyles.sh
bindd = $mainMod ALT, B, menu de diseño waybar, exec, $scriptsDir/WaybarLayout.sh

# Night light toggle (Hyprsunset)
bindd = $mainMod, N, alternar luz nocturna, exec, $scriptsDir/Hyprsunset.sh toggle

# FEATURES / EXTRAS (UserScripts)
bindd = $mainMod SHIFT, M, musica en linea, exec, $UserScripts/RofiBeats.sh
bindd = $mainMod, W, seleccionar fondo, exec, $UserScripts/WallpaperSelect.sh
bindd = $mainMod SHIFT, W, efectos de fondo, exec, $UserScripts/WallpaperEffects.sh
bindd = CTRL ALT, W, fondo aleatorio, exec, $UserScripts/WallpaperRandom.sh
bindd = $mainMod CTRL, O, alternar opacidad de ventana, setprop, active opaque toggle
bindd = $mainMod SHIFT, K, buscar atajos, exec, $scriptsDir/KeyBinds.sh
bindd = $mainMod SHIFT, A, menu de animaciones, exec, $scriptsDir/Animations.sh
bindd = $mainMod SHIFT, O, cambiar tema de terminal zsh, exec, $UserScripts/ZshChangeTheme.sh
bindld = CTRL $mainMod, space, cambiar teclado, exec, $scriptsDir/KeyboardLayout.sh switch
bindd = $mainMod ALT, C, calculadora, exec, $UserScripts/RofiCalc.sh

# Move current workspaces to monitors (left right up or down)
bindd = $mainMod CTRL, F9, mover espacio al monitor izq, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, mover espacio al monitor der, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, mover espacio al monitor arr, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, mover espacio al monitor aba, movecurrentworkspacetomonitor, d


#### SYSTEM ####
bindd = CTRL ALT, Delete, salir de Hyprland, exec, hyprctl dispatch exit 0
bindd = $mainMod, Q, cerrar ventana activa, killactive,
bindd = $mainMod SHIFT, Q, terminar proceso activo, exec, $scriptsDir/KillActiveProcess.sh
bindd = $mainMod, L, bloquear pantalla, exec, $scriptsDir/LockScreen.sh
bindd = CTRL ALT, L, bloquear pantalla, exec, $scriptsDir/LockScreen.sh
bindd = CTRL ALT, P, menu de energia, exec, $scriptsDir/Wlogout.sh
bindd = $mainMod SHIFT, N, panel de notificaciones, exec, swaync-client -t -sw
bindd = $mainMod SHIFT, E, menu de ajustes rapidos, exec, $scriptsDir/Kool_Quick_Settings.sh

# Master Layout
bindd = $mainMod CTRL, D, eliminar master, layoutmsg, removemaster
bindd = $mainMod, I, agregar master, layoutmsg, addmaster
# NOTE: J/K bindings are set dynamically by scripts/KeybindsLayoutInit.sh and scripts/ChangeLayout.sh
# (we intentionally do not bind them statically here to avoid conflicts across layouts)
# bindd = $mainMod, J, ciclar al siguiente, layoutmsg, cyclenext
# bindd = $mainMod, K, ciclar al anterior, layoutmsg, cycleprev
bindd = $mainMod CTRL, Return, intercambiar con master, layoutmsg, swapwithmaster

# Dwindle Layout
bindd = $mainMod SHIFT, I, alternar division dwindle, layoutmsg, togglesplit
bindd = $mainMod, P, alternar pseudo dwindle, pseudo,

# Works on either layout (Master or Dwindle)
bindd = $mainMod, M, establecer proporcion de division a 0.3, exec, hyprctl dispatch splitratio 0.3
# layout aware keybinds
exec-once = $scriptsDir/ChangeLayout.sh init


# Cycle windows; if floating bring to top
bindd = ALT, tab, ciclar ventana siguiente, cyclenext
bindd = ALT, tab, traer activa al frente, bringactivetotop

# Special Keys / Hot Keys
bindeld = , xf86audioraisevolume, subir volumen, exec, $scriptsDir/Volume.sh --inc
bindeld = , xf86audiolowervolume, bajar volumen, exec, $scriptsDir/Volume.sh --dec
bindeld = ALT, xf86audioraisevolume, subir volumen preciso, exec, $scriptsDir/Volume.sh --inc-precise
bindeld = ALT, xf86audiolowervolume, bajar volumen preciso, exec, $scriptsDir/Volume.sh --dec-precise
bindld = , xf86AudioMicMute, silenciar micrófono, exec, $scriptsDir/Volume.sh --toggle-mic
bindld = , xf86audiomute, silenciar audio, exec, $scriptsDir/Volume.sh --toggle
bindld = , xf86Sleep, suspender, exec, systemctl suspend
bindld = , xf86Rfkill, modo avión, exec, $scriptsDir/AirplaneMode.sh

# media controls using keyboards
bindld = , xf86AudioPlayPause, reproducir/pausar, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioPause, pausar, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioPlay, reproducir, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioNext, siguiente pista, exec, $scriptsDir/MediaCtrl.sh --nxt
bindld = , xf86AudioPrev, pista anterior, exec, $scriptsDir/MediaCtrl.sh --prv
bindld = , xf86audiostop, detener, exec, $scriptsDir/MediaCtrl.sh --stop

# Screenshot keybindings NOTE: You may need to press Fn key as well
bindd = $mainMod, Print, captura ahora, exec, $scriptsDir/ScreenShot.sh --now
bindd = $mainMod SHIFT, Print, captura area, exec, $scriptsDir/ScreenShot.sh --area
bindd = $mainMod CTRL, Print, captura en 5s, exec, $scriptsDir/ScreenShot.sh --in5
bindd = $mainMod CTRL SHIFT, Print, captura en 10s, exec, $scriptsDir/ScreenShot.sh --in10
bindd = ALT, Print, captura ventana activa, exec, $scriptsDir/ScreenShot.sh --active

# screenshot with swappy (another screenshot tool)
bindd = $mainMod SHIFT, S, captura swappy, exec, $scriptsDir/ScreenShot.sh --swappy

# Resize windows
binded = $mainMod SHIFT, left, redimensionar izq (-50), resizeactive, -50 0
binded = $mainMod SHIFT, right, redimensionar der (+50), resizeactive, 50 0
binded = $mainMod SHIFT, up, redimensionar arr (-50), resizeactive, 0 -50
binded = $mainMod SHIFT, down, redimensionar aba (+50), resizeactive, 0 50

# Move windows
bindd = $mainMod CTRL, left, mover ventana izq, movewindow, l
bindd = $mainMod CTRL, right, mover ventana der, movewindow, r
bindd = $mainMod CTRL, up, mover ventana arr, movewindow, u
bindd = $mainMod CTRL, down, mover ventana aba, movewindow, d

# Swap windows
bindd = $mainMod ALT, left, intercambiar ventana izq, swapwindow, l
bindd = $mainMod ALT, right, intercambiar ventana der, swapwindow, r
bindd = $mainMod ALT, up, intercambiar ventana arr, swapwindow, u
bindd = $mainMod ALT, down, intercambiar ventana aba, swapwindow, d

# group
bindd = $mainMod, G, alternar grupo, togglegroup

# Navigate within a group
bindd = $mainMod, Tab, siguiente en grupo, changegroupactive, f
bindd = $mainMod CTRL, tab, cambiar activo en grupo, changegroupactive
bindd = $mainMod SHIFT, Tab, anterior en grupo, changegroupactive, b

# Move window into/out of group
bindd = $mainMod CTRL, K, mover a la izq dentro del grupo, moveintogroup, l # Move active window left into a group A
bindd = $mainMod CTRL, L, mover a la der dentro del grupo, moveintogroup, r # Move active window right into a group
bindd = $mainMod CTRL, H, sacar activa del grupo, moveoutofgroup # Move active window out of group

# Try to dynamically move in grouped window and when ungrouped
#  Not working for me DW 11/26/25  PR: https://github.com/0o0-ct/Pixi-Arch-A/Hyprland-Dots/pull/872
#bindd = $mainMod, right, enfocar der, exec, bash -c 'if hyprctl activewindow -j | jq -e "((.grouped | type) == \"boolean\") or (.address == (.grouped[-1] // empty))" >/dev/null 2>&1; then hyprctl dispatch movefocus r; else hyprctl dispatch changegroupactive f; fi'
#bindd = $mainMod, left, enfocar izq, exec, bash -c 'if hyprctl activewindow -j | jq -e "((.grouped | type) == \"boolean\") or (.address == (.grouped[0] // empty))" >/dev/null 2>&1; then hyprctl dispatch movefocus l; else hyprctl dispatch changegroupactive b; fi'

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, enfocar izq, movefocus, l
bindd = $mainMod, right, enfocar der, movefocus, r
bindd = $mainMod, up, enfocar arr, movefocus, u
bindd = $mainMod, down, enfocar aba, movefocus, d

# Workspaces related
bindd = $mainMod, tab, siguiente espacio, workspace, m+1
bindd = $mainMod SHIFT, tab, espacio anterior, workspace, m-1

# Special workspace
bindd = $mainMod SHIFT, U, mover a espacio especial, movetoworkspace, special
bindd = $mainMod, U, alternar espacio especial, togglespecialworkspace,

# The following mappings use the key codes to better support various keyboard layouts
# 1 is code:10, 2 is code 11, etc
# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, code:10, espacio 1, workspace, 1 # NOTE: code:10 = key 1
bindd = $mainMod, code:11, espacio 2, workspace, 2 # NOTE: code:11 = key 2
bindd = $mainMod, code:12, espacio 3, workspace, 3 # NOTE: code:12 = key 3
bindd = $mainMod, code:13, espacio 4, workspace, 4 # NOTE: code:13 = key 4
bindd = $mainMod, code:14, espacio 5, workspace, 5 # NOTE: code:14 = key 5
bindd = $mainMod, code:15, espacio 6, workspace, 6 # NOTE: code:15 = key 6
bindd = $mainMod, code:16, espacio 7, workspace, 7 # NOTE: code:16 = key 7
bindd = $mainMod, code:17, espacio 8, workspace, 8 # NOTE: code:17 = key 8
bindd = $mainMod, code:18, espacio 9, workspace, 9 # NOTE: code:18 = key 9
bindd = $mainMod, code:19, espacio 10, workspace, 10 # NOTE: code:19 = key 0

# Move active window and follow to workspace mainMod + SHIFT [0-9]
bindd = $mainMod SHIFT, code:10, mover a espacio 1, movetoworkspace, 1 # NOTE: code:10 = key 1
bindd = $mainMod SHIFT, code:11, mover a espacio 2, movetoworkspace, 2 # NOTE: code:11 = key 2
bindd = $mainMod SHIFT, code:12, mover a espacio 3, movetoworkspace, 3 # NOTE: code:12 = key 3
bindd = $mainMod SHIFT, code:13, mover a espacio 4, movetoworkspace, 4 # NOTE: code:13 = key 4
bindd = $mainMod SHIFT, code:14, mover a espacio 5, movetoworkspace, 5 # NOTE: code:14 = key 5
bindd = $mainMod SHIFT, code:15, mover a espacio 6, movetoworkspace, 6 # NOTE: code:15 = key 6
bindd = $mainMod SHIFT, code:16, mover a espacio 7, movetoworkspace, 7 # NOTE: code:16 = key 7
bindd = $mainMod SHIFT, code:17, mover a espacio 8, movetoworkspace, 8 # NOTE: code:17 = key 8
bindd = $mainMod SHIFT, code:18, mover a espacio 9, movetoworkspace, 9 # NOTE: code:18 = key 9
bindd = $mainMod SHIFT, code:19, mover a espacio 10, movetoworkspace, 10 # NOTE: code:19 = key 0
bindd = $mainMod SHIFT, bracketleft, mover a espacio anterior, movetoworkspace, -1 # brackets [
bindd = $mainMod SHIFT, bracketright, mover a siguiente espacio, movetoworkspace, +1 # brackets ]

# Move active window to a workspace silently mainMod + CTRL [0-9]
bindd = $mainMod CTRL, code:10, mover silencioso a espacio 1, movetoworkspacesilent, 1 # NOTE: code:10 = key 1
bindd = $mainMod CTRL, code:11, mover silencioso a espacio 2, movetoworkspacesilent, 2 # NOTE: code:11 = key 2
bindd = $mainMod CTRL, code:12, mover silencioso a espacio 3, movetoworkspacesilent, 3 # NOTE: code:12 = key 3
bindd = $mainMod CTRL, code:13, mover silencioso a espacio 4, movetoworkspacesilent, 4 # NOTE: code:13 = key 4
bindd = $mainMod CTRL, code:14, mover silencioso a espacio 5, movetoworkspacesilent, 5 # NOTE: code:14 = key 5
bindd = $mainMod CTRL, code:15, mover silencioso a espacio 6, movetoworkspacesilent, 6 # NOTE: code:15 = key 6
bindd = $mainMod CTRL, code:16, mover silencioso a espacio 7, movetoworkspacesilent, 7 # NOTE: code:16 = key 7
bindd = $mainMod CTRL, code:17, mover silencioso a espacio 8, movetoworkspacesilent, 8 # NOTE: code:17 = key 8
bindd = $mainMod CTRL, code:18, mover silencioso a espacio 9, movetoworkspacesilent, 9 # NOTE: code:18 = key 9
bindd = $mainMod CTRL, code:19, mover silencioso a espacio 10, movetoworkspacesilent, 10 # NOTE: code:19 = key 0
bindd = $mainMod CTRL, bracketleft, mover silencioso a espacio anterior, movetoworkspacesilent, -1 # brackets [
bindd = $mainMod CTRL, bracketright, mover silencioso a siguiente espacio, movetoworkspacesilent, +1 # brackets ]

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, siguiente espacio, workspace, e+1
bindd = $mainMod, mouse_up, espacio anterior, workspace, e-1
bindd = $mainMod, period, siguiente espacio, workspace, e+1
bindd = $mainMod, comma, espacio anterior, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, mover ventana, movewindow # NOTE: mouse:272 = left click
bindmd = $mainMod, mouse:273, redimensionar ventana, resizewindow # NOTE: mouse:272 = right click
