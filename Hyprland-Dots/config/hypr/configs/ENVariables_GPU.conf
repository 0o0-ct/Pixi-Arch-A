# Variables de entorno de GPU generadas automáticamente
# Configuración de GPU dinámica para Hyprland - Modo Intel Integrated (ahorro energético)

# Usar solo GPU Intel integrada para el compositor y tareas cotidianas
# NVIDIA se activará solo cuando ejecutes aplicaciones con primus-run o optirun

env = AQ_DRM_DEVICES,/dev/dri/card0
env = WLR_DRM_DEVICES,/dev/dri/card0
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,mesa
