# Performance Profile — Controla blur, sombras, animaciones y apps de inicio
# PERFIL: quality (GPU potente - máxima fidelidad visual y glassmorphism)

$PERF_PROFILE = quality

# Blur: COMPLETO (glassmorphism auténtico)
$BLUR_ENABLED = 1
$BLUR_SIZE = 12
$BLUR_PASSES = 2
$BLUR_VIBRANCY = 0.30
$BLUR_CONTRAST = 0.95
$BLUR_BRIGHTNESS = 0.90

# Shadows: COMPLETAS
$SHADOW_ENABLED = 1
$SHADOW_RANGE = 20
$SHADOW_RENDER_POWER = 3

# Animations: COMPLETAS
$ANIM_BORDER_ENABLED = 1
$ANIM_WINDOW_ENABLED = 1
$ANIM_SPEED_FACTOR = 1.0
$BASE_WIN_SPEED = 6
$BASE_WIN_IN_SPEED = 5
$BASE_WIN_OUT_SPEED = 3
$BASE_WIN_MOVE_SPEED = 5
$BASE_BORDER_SPEED = 1
$BASE_FADE_SPEED = 3
$BASE_WS_SPEED = 5

# Startup Apps: TODAS
$START_AGS = 1
$START_OVERVIEW = 1
