# Performance Profile — Controla blur, sombras, animaciones y apps de inicio
# PERFIL: performance (optimizado para bajo consumo, mantiene glas)

$PERF_PROFILE = performance

# Blur: LIGERO (menos costly, mantiene glas)
$BLUR_ENABLED = 1
$BLUR_SIZE = 5
$BLUR_PASSES = 1
$BLUR_VIBRANCY = 0.0
$BLUR_CONTRAST = 0.90
$BLUR_BRIGHTNESS = 0.95

# Shadows: LIGERAS
$SHADOW_ENABLED = 1
$SHADOW_RANGE = 6
$SHADOW_RENDER_POWER = 1

# Animations: REDUCIDAS
$ANIM_BORDER_ENABLED = 1
$ANIM_WINDOW_ENABLED = 0
$ANIM_SPEED_FACTOR = 0.7
$BASE_WIN_SPEED = 5
$BASE_WIN_IN_SPEED = 5
$BASE_WIN_OUT_SPEED = 3
$BASE_WIN_MOVE_SPEED = 5
$BASE_BORDER_SPEED = 1
$BASE_FADE_SPEED = 3
$BASE_WS_SPEED = 3

# Startup Apps: TODAS
$START_AGS = 1
$START_OVERVIEW = 1
