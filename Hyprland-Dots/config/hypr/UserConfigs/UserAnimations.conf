# Animaciones controladas por PerformanceProfile.conf
# Edita ~/.config/hypr/UserConfigs/PerformanceProfile.conf ($PERF_PROFILE)
# Para cambiar de perfil, usa: optimize.sh --apply --profile=performance|balanced|quality

source = $HOME/.config/hypr/UserConfigs/PerformanceProfile.conf

animations {
  enabled = yes

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.5, 0, 0.99, 0.99
  bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
  
  # Ventanas: activas en balanced/quality
  animation = windows, $ANIM_WINDOW_ENABLED, $BASE_WIN_SPEED, wind, slide
  animation = windowsIn, $ANIM_WINDOW_ENABLED, $BASE_WIN_IN_SPEED, winIn, slide
  animation = windowsOut, $ANIM_WINDOW_ENABLED, $BASE_WIN_OUT_SPEED, smoothOut, slide
  animation = windowsMove, $ANIM_WINDOW_ENABLED, $BASE_WIN_MOVE_SPEED, wind, slide
  
  # Border: solo en balanced/quality
  animation = border, $ANIM_BORDER_ENABLED, $BASE_BORDER_SPEED, liner
  animation = borderangle, 0, 180, liner, loop  # DESHABILITADO: loop infinito consume GPU constantemente
  
  # Fade: solo en quality
  animation = fade, $ANIM_WINDOW_ENABLED, $BASE_FADE_SPEED, smoothOut
  
  # Workspaces: siempre activo (esencial para UX)
  animation = workspaces, 1, $BASE_WS_SPEED, overshot
  animation = workspacesIn, 1, $BASE_WS_SPEED, winIn, slide
  animation = workspacesOut, 1, $BASE_WS_SPEED, winOut, slide
}