# Decoration Settings with Material Design 3 Monet Colors

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust / matugen
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color15 $color14 45deg
  col.inactive_border = rgba(0e141566)
}

decoration {
  rounding = 14
  
  active_opacity = 1.0
  inactive_opacity = 0.95
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.15
  dim_special = 0.8

  shadow {
    enabled = true
    range = 20
    render_power = 3
    color = rgba(00000030)
    color_inactive = rgba(00000015)
  }

  blur {
    enabled = true
    size = 12
    passes = 2
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
    noise = 0.012
    contrast = 0.95
    brightness = 0.90
    vibrancy = 0.30
    vibrancy_darkness = 0.0
  }
}

group {
  col.border_active = $color15
  col.border_inactive = rgba(0e141566)

  groupbar {
    col.active = $color15
    col.inactive = rgba(0e141566)
  }
}
