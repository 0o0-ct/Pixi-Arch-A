# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color12
  col.inactive_border = $color10
}

decoration {
  rounding = 14
  
  active_opacity = 1.0
  inactive_opacity = 0.95
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.15
  dim_special = 0.8

  shadow {
    enabled = true
    range = 20
    render_power = 3

    color = rgba(0, 0, 0, 0.45)
    color_inactive = rgba(30, 30, 30, 0.15)
  }

  blur {
    enabled = true
    size = 10
    passes = 4
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
    noise = 0.015
    contrast = 0.9
    brightness = 0.85
    vibrancy = 0.2
    vibrancy_darkness = 0.0
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
