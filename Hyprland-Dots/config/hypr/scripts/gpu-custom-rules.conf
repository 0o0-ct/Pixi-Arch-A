# ============================================================
# Reglas personalizadas de GPU — gpu-custom-rules.conf
# ============================================================
# Agrega aquí tus aplicaciones personalizadas que requieren GPU NVIDIA.
# Formato: app_name:razon
#
# Las apps listadas aquí se ejecutarán con la GPU NVIDIA dedicada.
# Las apps NO listadas se ejecutarán con la GPU integrada (Intel/AMD).
#
# Ejemplos:
#   mygame:juego personalizado
#   gimp:edición de imágenes con filtros pesados
#   krita:dibujo digital
#
# Para apps ligeras que quieres forzar a usar Intel, no las agregues aquí.
# Usa: prime-launch --force-igpu <app>
#
# Para apps que quieres forzar a usar NVIDIA:
# Usa: prime-launch --force-nvidia <app>
#
# ============================================================

# --- Agrega tus reglas personalizadas abajo ---

