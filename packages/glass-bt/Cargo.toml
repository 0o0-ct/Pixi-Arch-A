[package]
name = "glass-bt"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures-util = "0.3.34"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
